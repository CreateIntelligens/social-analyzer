services:
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${PORT:-8901}:8901"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/usr/share/nginx/html:ro
    depends_on:
      - social-analyzer
    networks:
      - app-network

  social-analyzer:
    build: .
    restart: unless-stopped
    expose:
      - "9005"
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      - PORT=9005
      - GOOGLE_SEARCH_API_KEY=${GOOGLE_SEARCH_API_KEY}
      - GOOGLE_SEARCH_ENGINE_ID=${GOOGLE_SEARCH_ENGINE_ID}
    env_file:
      - .env
    depends_on:
      - hub
    networks:
      - app-network
    entrypoint: npm start -- --gui --docker --grid "http://hub:4444/wd/hub"

  hub:
    image: selenium/hub
    restart: unless-stopped
    expose:
      - "4444"
    environment:
      GRID_MAX_SESSION: 16
      GRID_BROWSER_TIMEOUT: 300
      GRID_TIMEOUT: 300
      SE_SESSION_REQUEST_TIMEOUT: 600
      SE_NODE_SESSION_TIMEOUT: 600
    networks:
      - app-network

  firefox:
    image: selenium/node-firefox
    container_name: web-automation_firefox
    restart: unless-stopped
    depends_on:
      - hub
    environment:
      SE_EVENT_BUS_HOST: hub
      SE_EVENT_BUS_PUBLISH_PORT: 4442
      SE_EVENT_BUS_SUBSCRIBE_PORT: 4443
      SE_NODE_MAX_SESSIONS: ${CPU_CORES:-2}
    volumes:
      - /dev/shm:/dev/shm
    networks:
      - app-network

  swagger-ui:
    image: swaggerapi/swagger-ui:latest
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      SWAGGER_JSON: /openapi.yaml
    volumes:
      - ./openapi.yaml:/openapi.yaml:ro
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
