openapi: 3.0.3
info:
  title: Social Analyzer API
  description: |
    API for analyzing and finding a person's profile across +1000 social media websites.

    ## 功能特色
    - 🔍 快速掃描使用者資料
    - 🌐 支援 1000+ 社交媒體平台
    - 📊 統計分析與元數據
    - 🔎 搜尋引擎整合

  version: 2.0.32
  contact:
    name: QeeqBox
    url: https://github.com/qeeqbox/social-analyzer
  license:
    name: AGPL-3.0
    url: https://www.gnu.org/licenses/agpl-3.0.html

servers:
  - url: http://localhost:8901
    description: 本地開發環境
  - url: /
    description: 當前伺服器

tags:
  - name: Analysis
    description: 使用者分析相關 API
  - name: Logs
    description: 日誌查詢
  - name: Settings
    description: 設定管理
  - name: Utilities
    description: 工具功能
  - name: Health
    description: 健康檢查

paths:
  /analyze_string:
    post:
      tags:
        - Analysis
      summary: 分析使用者名稱
      description: |
        在多個社交媒體平台搜尋指定的使用者名稱，支援多種掃描模式和分析選項。

        ## 掃描模式
        - **FindUserProfilesFast** - 快速掃描（推薦）
        - **FindUserProfilesSlow** - 深度掃描
        - **FindUserProfilesSpecial** - 特殊掃描
        - **GetUserProfilesFast** - 取得所有資料（不管是否檢測到）

        ## 進階選項
        - **LookUps** - 使用搜尋引擎查詢
        - **CustomSearch** - 自訂搜尋
        - **CategoriesStats** - 產生類別統計
        - **MetadataStats** - 產生元數據統計

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - string
                - uuid
                - option
              properties:
                string:
                  type: string
                  description: 要搜尋的使用者名稱（可用逗號分隔多個使用者）
                  example: "johndoe"
                uuid:
                  type: string
                  description: 任務的唯一識別碼
                  example: "task-12345"
                option:
                  type: string
                  description: 掃描選項（逗號分隔多個選項）
                  example: "FindUserProfilesFast,LookUps"
                group:
                  type: boolean
                  description: 是否為多使用者批次搜尋
                  default: false
            examples:
              快速掃描:
                value:
                  string: "johndoe"
                  uuid: "task-001"
                  option: "FindUserProfilesFast"
                  group: false
              深度分析:
                value:
                  string: "johndoe"
                  uuid: "task-002"
                  option: "FindUserProfilesFast,LookUps,CategoriesStats"
                  group: false
              多使用者:
                value:
                  string: "johndoe,janedoe,testuser"
                  uuid: "task-003"
                  option: "FindUserProfilesFast"
                  group: true
      responses:
        '200':
          description: 分析成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    description: 分析結果項目
                  detected:
                    type: object
                    description: 檢測到的資料
                  stats:
                    type: object
                    description: 統計資訊

  /get_logs:
    post:
      tags:
        - Logs
      summary: 取得任務日誌
      description: 根據任務 UUID 取得執行日誌
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - uuid
              properties:
                uuid:
                  type: string
                  description: 任務的唯一識別碼
                  example: "task-12345"
      responses:
        '200':
          description: 日誌內容
          content:
            text/plain:
              schema:
                type: string

  /get_settings:
    get:
      tags:
        - Settings
      summary: 取得當前設定
      description: 取得應用程式的當前設定配置
      responses:
        '200':
          description: 設定資料
          content:
            application/json:
              schema:
                type: object

  /save_settings:
    post:
      tags:
        - Settings
      summary: 儲存設定
      description: 儲存應用程式設定
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: 儲存成功

  /generate:
    get:
      tags:
        - Utilities
      summary: 產生使用者名稱組合
      description: 根據提供的字詞產生排列組合
      parameters:
        - name: words
          in: query
          description: 要組合的字詞陣列
          schema:
            type: array
            items:
              type: string
      responses:
        '200':
          description: 組合結果
          content:
            application/json:
              schema:
                type: object
                properties:
                  combinations:
                    type: array
                    items:
                      type: string

  /cancel:
    post:
      tags:
        - Utilities
      summary: 取消任務
      description: 取消正在執行的分析任務
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - uuid
                - option
              properties:
                uuid:
                  type: string
                  description: 要取消的任務 UUID
                  example: "task-12345"
                option:
                  type: string
                  enum: ["on"]
                  example: "on"
      responses:
        '200':
          description: 取消成功
          content:
            application/json:
              schema:
                type: string
                example: "Done"

  /health:
    get:
      tags:
        - Health
      summary: 健康檢查
      description: 檢查服務是否正常運行
      responses:
        '200':
          description: 服務正常
          content:
            text/plain:
              schema:
                type: string
                example: "healthy"

components:
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          description: 錯誤訊息
