upstream social_analyzer {
    server social-analyzer:9005;
}

upstream selenium_hub {
    server hub:4444;
}

upstream swagger_ui {
    server swagger-ui:8080;
}

server {
    listen 8901;
    server_name localhost;
    root /usr/share/nginx/html;
    index app.html;

    # API 文檔 - Swagger UI（優先處理，避免被靜態檔案規則攔截）
    location /docs {
        return 301 /docs/;
    }

    location /docs/ {
        proxy_pass http://swagger_ui/;
        proxy_http_version 1.1;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /docs;
    }

    # API endpoints - 轉發給 Node.js
    location ~ ^/(analyze_string|get_logs|get_settings|save_settings|generate|cancel)$ {
        proxy_pass http://social_analyzer;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 長時間任務超時設定（slow 模式可能需要較長時間）
        proxy_read_timeout 1800s;      # 30 分鐘
        proxy_connect_timeout 300s;    # 5 分鐘
        proxy_send_timeout 300s;       # 5 分鐘

        # 禁用快取 API 回應
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # 靜態檔案快取設定（不包含 /docs 路徑）
    location ~* ^/(?!docs/).*\.(html|css|js|json)$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # Selenium Grid Hub (選用)
    location /grid/ {
        proxy_pass http://selenium_hub/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 健康檢查
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Favicon 處理（避免 404 錯誤）
    location = /favicon.ico {
        access_log off;
        log_not_found off;
        return 204;
    }

    # 所有其他請求 - Nginx 提供靜態檔案
    location / {
        try_files $uri $uri/ =404;
    }
}
